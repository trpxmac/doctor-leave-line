version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bsi-doctor-leave-app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      # Persistent local database store (fallback when Supabase is disconnected)
      - ./server/data:/app/server/data
      # Persistent medical certificate attachments
      - ./uploads:/app/uploads
    networks:
      - bsi-network

networks:
  bsi-network:
    driver: bridge
